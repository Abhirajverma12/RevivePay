services:
  # Backend NestJS API Web Service
  - type: web
    name: revivepay-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install && npm run build:backend
    startCommand: npx prisma db push && npm run demo:seed && npm run start:backend
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: revivepay-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: revivepay-redis
          property: connectionString

databases:
  # Managed PostgreSQL Database
  - name: revivepay-db
    plan: free
    region: oregon
    databaseName: revivepay
    user: revivepay_user

  # Managed Redis
  - name: revivepay-redis
    type: redis
    plan: free
    region: oregon
    maxmemoryPolicy: noeviction
